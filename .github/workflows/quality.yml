name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests
      - run: python3 -m py_compile skills/data360beast/runtime/data360beast_runtime.py skills/data360beast/scripts/data360beast.py tools/docs_watch.py tools/refresh_skills_from_sf_docs.py tools/validate_expertise.py
      - run: python3 tools/run_architecture_evals.py
      - run: python3 tools/validate_expertise.py
      - run: python3 tools/validate_docs_watch.py
      - run: python3 tools/skill_install_smoke.py
      - run: python3 tools/release_readiness.py
